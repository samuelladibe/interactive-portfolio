# Deploys the portfolio to Cloud Run on every push to main.
#
# No credentials are stored: GitHub's OIDC token is exchanged for short-lived Google access
# through Workload Identity Federation, and Google only accepts tokens from this repository's
# main branch. Project details live in repository secrets so they never appear in logs.
#
# Required repository secrets:
#   GCP_PROJECT_ID     Google Cloud project ID
#   GCP_WIF_PROVIDER   projects/<number>/locations/global/workloadIdentityPools/github/providers/github-repo
#   GCP_DEPLOY_SA      portfolio-deployer@<project>.iam.gserviceaccount.com

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deployment at a time; a newer push waits instead of racing the current one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGION: europe-west1
  SERVICE: portfolio-samuelladibe
  REPOSITORY: portfolio

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Check the code
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npx tsc --noEmit

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Build and push the image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/site:$GITHUB_SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Only the image changes: the service account, public access and scaling set when the
      # service was created stay as they are.
      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" --project "$PROJECT_ID" --quiet

      - name: Check the live site
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format 'value(status.url)')
          for path in /fr /en; do
            curl --fail --silent --show-error --output /dev/null --retry 3 --retry-delay 5 "$URL$path"
          done
          echo "Deployed and answering: $URL"
